      const v = inp.value.replace(/\D/g, '').slice(0, OTP.len), prev = OTP.value;
      inp.value = v; OTP.value = v;
      if (v.length < prev.length || !v.startsWith(prev)) deckPaint(el, 0, false);  // replaced or deleted
      deckPaint(el, v.length, false);
      for (let i = v.startsWith(prev) ? prev.length : 0; i < v.length; i++) deckPop(el, i, v[i], false);
      const m = $('#otp-msg'); if (m.classList.contains('error') && OTP.tries < OTP.max) { m.textContent = ''; m.className = 'pin-msg'; }
      if (v.length === OTP.len) otpSubmit();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); otpSubmit(); } });
    deckKeyboard(inp);
    startResend();
  }
});
/* OTP / PIN: take keyboard input as soon as the modal opens, without clicking the boxes first */
function deckKeyboard(inp) {
  const focus = () => { if (document.body.contains(inp) && !inp.disabled) try { inp.focus({ preventScroll: true }); } catch (_) {} };
  later(focus, 60);
  const onKey = e => {
    if (!document.body.contains(inp)) return document.removeEventListener('keydown', onKey);
    if (document.activeElement === inp || inp.disabled || e.ctrlKey || e.metaKey || e.altKey) return;
    const a = document.activeElement;
    if (a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (!/^\d$/.test(e.key) && e.key !== 'Backspace') return;
    e.preventDefault();
    const max = +inp.maxLength || 6;
    inp.value = e.key === 'Backspace' ? inp.value.slice(0, -1) : (inp.value + e.key).slice(0, max);
    inp.dispatchEvent(new Event('input'));
    focus();
  };
  document.addEventListener('keydown', onKey);
}
function otpKey(k) {
  if (OTP.busy) return;
  const inp = $('#otp-in');
  inp.value = k === 'del' ? OTP.value.slice(0, -1) : (OTP.value + k).slice(0, OTP.len);
  inp.dispatchEvent(new Event('input'));
}
function startResend() {
  let t = 30;
  const meta = $('#otp-meta');
  meta.innerHTML = 'Resend code in <b id="otp-t">0:30</b>';
  every(() => {
    t--;
    if (t > 0) { const el = $('#otp-t'); if (el) el.textContent = '0:' + String(t).padStart(2, '0'); return; }
    meta.innerHTML = 'Didn’t get a code? <button onclick="event.stopPropagation();startResend();toast(\'New code sent\')">Resend</button>';
    clearTimers();
  }, 1000);
}
function otpSubmit() {
  if (OTP.busy || OTP.value.length !== OTP.len || OTP.tries >= OTP.max) return;
  const el = $('#otpDeck'), m = $('#otp-msg'), p = S.nav.cur.params;
  const ok = OTP.value !== '000000';
  OTP.busy = true;
  deckPaint(el, OTP.len, true);
  deckRun(el, ok, {
    stack: () => { m.className = 'pin-msg'; m.textContent = 'Verifying…'; },
    ok: () => { m.className = 'pin-msg success'; m.textContent = 'Verified'; },
    fail: () => {
      OTP.tries++;
      const left = OTP.max - OTP.tries;
      m.className = 'pin-msg error';
      m.textContent = left > 0 ? `Incorrect code. ${left} attempt${left === 1 ? '' : 's'} left.` : 'Too many attempts. Request a new code.';
    },
    done: good => {
      if (!good) { OTP.value = ''; OTP.busy = false; const inp = $('#otp-in'); inp.value = ''; deckPaint(el, 0, false); return; }
      if (p.mode === 'signup') go('kyc-intro', {}, { replace: true });
      else if (p.mode === 'reset') go('reset-password', {}, { replace: true });
      else if (p.mode === 'payment') go('send-processing', {}, { replace: true });
      else root('home');
    }
  });
}

const pinCards = () => deckCards($('#deck'));
function pinMsg(t, c) { const m = $('#pinMsg'); if (m) { m.textContent = t; m.className = 'pin-msg' + (c ? ' ' + c : ''); } }
function pinRender() {
  const deck = $('#deck'); if (!deck) return;
  deckPaint(deck, PIN.value.length, PIN.busy || !!PIN.lock);
  const inp = $('#pin-in');
  if (inp) inp.disabled = PIN.busy || !!PIN.lock;
}
function pinPress(d) {
  if (PIN.busy || PIN.lock || PIN.value.length >= PIN.len) return;
  const i = PIN.value.length;
  PIN.value += d;
  pinRender();
  deckPop($('#deck'), i, d, true);
  if (PIN.value.length === PIN.len) pinVerify();
}
function pinDel() {
  if (PIN.busy || PIN.lock) return;
  PIN.value = PIN.value.slice(0, -1);
  pinRender();
}
function pinVerify() {
  PIN.busy = true;
  pinRender();
  const ok = PIN.value === PIN.correct;
  deckRun($('#deck'), ok, {
    stack: () => pinMsg('Verifying…'),
    ok: () => { PIN.attempts = 0; pinMsg('PIN verified', 'success'); },
    fail: () => {
      PIN.attempts++;
      const left = PIN.max - PIN.attempts;
      pinMsg(left > 0 ? `Incorrect PIN. ${left} attempt${left === 1 ? '' : 's'} left.` : 'Incorrect PIN.', 'error');
    },
    done: good => {
      PIN.value = '';
      const inp = $('#pin-in'); if (inp) inp.value = '';
      if (good) { PIN.busy = false; return root('home'); }
      if (PIN.attempts < PIN.max) { PIN.busy = false; return pinRender(); }
      let s = PIN.lockSecs;
      PIN.lock = setInterval(() => {
        s--;
        if (s > 0) return pinMsg(`Too many attempts. Try again in ${s}s`, 'error');
        clearInterval(PIN.lock); PIN.lock = null; PIN.attempts = 0; PIN.busy = false; pinMsg(''); pinRender();
      }, 1000);
      pinMsg(`Too many attempts. Try again in ${s}s`, 'error');
      PIN.busy = false; pinRender();
    }
  });
}
function pinBio() {
  if (PIN.busy || PIN.lock) return;
  PIN.busy = true; pinRender(); pinMsg('Checking Face ID / Touch ID…');
  deckLayout('stack');
  setTimeout(() => { deckLayout('merge'); setTimeout(() => $('#deck').classList.add('ok'), dT(260)); pinMsg('Biometrics verified', 'success'); setTimeout(() => { PIN.busy = false; root('home'); }, dT(1250)); }, dT(900));
}
document.addEventListener('keydown', e => {
  if (S.nav.cur?.id !== 'unlock') return;
  if (e.target?.matches('input, textarea')) return;
  if (e.key >= '0' && e.key <= '9') pinPress(+e.key);
  else if (e.key === 'Backspace') pinDel();
});

function initWalletSlides() {
  const el = $('#wSlides'); if (!el) return;

  walletNavState();
  /* swipe: the card follows the finger, then snaps to the nearest slide */
  let x0 = null, s0 = 0, moved = false;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; s0 = el.scrollLeft; moved = false; });
  el.addEventListener('pointermove', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0;
    if (Math.abs(dx) > 6 && !moved) { moved = true; try { el.setPointerCapture(e.pointerId); } catch (_) {} }
    if (moved) el.scrollLeft = s0 - dx;
  });
  const end = e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if (!moved) return;
    walletStep(Math.abs(dx) > el.clientWidth * 0.18 ? (dx < 0 ? 1 : -1) : 0);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

function statementRows() {

  return S.transactions.filter(t => {

function makeStatementPdf(rows) {
  const plain = value => String(value ?? '').replace(/[^\x20-\x7E]/g, ' ').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const lines = [
    'REMI TRANSFER STATEMENT',
    `Account: ${S.user.first} ${S.user.last}`,
    `Period: ${statementRangeLabel()}  |  Generated: ${new Date().toLocaleDateString('en-US')}`,
    '',
    'Reference       Date         Recipient                 Amount       Status',
    ...rows.slice(0, 18).map(t => {
      const b = benById(t.ben);
      const recipient = b ? fullName(b).slice(0, 24) : 'Recipient';
      return `${t.ref.padEnd(15)} ${new Date(t.date).toISOString().slice(0, 10)}   ${recipient.padEnd(25)} ${usd(t.total).padStart(10)}   ${STATUS[t.status].label}`;
    }),
    rows.length > 18 ? `... and ${rows.length - 18} more transfer(s)` : '',
    '',
    `Total transfers: ${rows.length}`,
    'Generated by Remi'
  ].filter((line, index, list) => line || index < list.length - 2);
  const stream = ['BT', '/F1 18 Tf', '50 790 Td', `(${plain(lines[0])}) Tj`, '/F1 10 Tf', '0 -26 Td', ...lines.slice(1).flatMap(line => [`(${plain(line)}) Tj`, '0 -16 Td']), 'ET'].join('\n');
  const objects = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  objects.forEach((object, index) => { offsets.push(pdf.length); pdf += `${index + 1} 0 obj\n${object}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n${offsets.slice(1).map(offset => `${String(offset).padStart(10, '0')} 00000 n \n`).join('')}trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf], { type: 'application/pdf' });
}

            <option value="refunds" ${S.statement.status === 'refunds' ? 'selected' : ''}>Refunds</option>
          </select></div>
        </div>
        ${generated ? `<div class="section-h"><h3>Statement preview</h3><span>${rows.length} transfer${rows.length === 1 ? '' : 's'}</span></div>
          <div class="card">${rows.length ? rows.slice(0, 3).map(txLine).join('') : `<div class="row" style="cursor:default"><div class="tx"><div class="t1">No transfers found</div><div class="t2">Try a different period or status.</div></div></div>`}</div>` : ''}
      </div></div>

});
/* compact date for home rows: drop the year when it is the current year */
const shortDT = d => { const x = new Date(d), y = x.getFullYear() === new Date().getFullYear();
  return x.toLocaleDateString('en-US', y ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' }) + ' • ' + fmtTime(x); };
/* Transactions list on Home: day groups, arrow tile, "TrxID", signed amount + time */
function dayLabel(d) {
  const x = new Date(d), t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((t - new Date(x.getFullYear(), x.getMonth(), x.getDate())) / 864e5);
  return days === 0 ? 'Today' : days === 1 ? 'Yesterday' : x.toLocaleDateString('en-US', x.getFullYear() === t.getFullYear() ? { weekday: 'long', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
}
function txGroups(list) {
  const groups = [];
  list.forEach(t => {
    const k = dayLabel(t.date);
    const g = groups.find(x => x.k === k);
    g ? g.items.push(t) : groups.push({ k, d: t.date, items: [t] });
  });
  return groups.map(g => `<div class="t-dayh"><b>${g.k}</b><span>${new Date(g.d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span></div>
    <div class="t-group-card">${g.items.map(txLine).join('')}</div>`).join('');
}
/* status pill: icon + label */
function txPill(t) {
  const m = { completed: ['green', 'check', 'Completed'], submitted: ['amber', 'clock', 'In progress'], processing: ['amber', 'clock', 'In progress'],
    payout: ['amber', 'clock', 'Pending'], compliance: ['amber', 'shield', 'In review'], failed: ['red', 'xcircle', 'Failed'],
    refund_pending: ['amber', 'refund', 'Refunding'], refunded: ['green', 'check', 'Refunded'] }[t.status];
  return `<span class="t-pill ${m[0]}">${ic(m[1], 2.6)}${m[2]}</span>`;
}
function txLine(t) {
  const b = benById(t.ben), who = b ? `${b.first} ${b.last[0]}.` : 'Recipient';
  const refund = ['refunded', 'refund_pending'].includes(t.status);
  const kind = refund ? 'in' : t.status === 'failed' ? 'fail' : 'out';
  const amt = refund ? `+${usdH(t.total)}` : `\u2212${usdH(t.amount)}`;
  return `<button class="t-row ${kind}" onclick="go('tx-detail',{ref:'${t.ref}'})">
    <span class="t-ic">${ic(refund ? 'receive' : 'send', 2.6)}${b ? portrait(b, 20).replace('class="pt"', 'class="pt t-av"') : ''}</span>
    <span class="t-tx"><span class="t-n">${esc(who)}</span>
      ${refund ? `<span class="t-sub">Refund from ${esc(who)}</span>` : ''}
      <span class="t-id">${t.ref} \u2022 ${fmtTime(t.date)}</span></span>
    <span class="t-end"><span class="t-a">${amt}</span>${txPill(t)}</span>
    ${ic('chev', 2.4).replace('<svg', '<svg class="t-chev"')}</button>`;
}
function emptyState(icon, h, p, cta, fn) {
  return `<div class="empty"><div class="ei">${ic(icon)}</div><h3>${h}</h3><p>${p}</p>${cta ? `<button class="btn btn-primary btn-sm" style="width:auto;padding:0 20px" onclick="${fn}">${cta}</button>` : ''}</div>`;
}

screen('notifications', 'NT-01', 'Home & Navigation', 'Notification center', {
  render: () => {
    const kindIc = { processing: ['clock', 'amber'], failed: ['alert', 'red'], security: ['shield', 'blue'], completed: ['check', 'green'], kyc: ['shieldCheck', 'green'], refund: ['refund', ''] };
    const items = S.notifications;
    const row = n => `<button class="row" onclick="S.notifications.find(x=>x.id==='${n.id}').unread=false;${n.ref ? `go('tx-detail',{ref:'${n.ref}'})` : n.kind === 'security' ? "go('login-activity')" : 'render()'}" style="align-items:flex-start">
      <div class="ic ${kindIc[n.kind][1]}">${ic(kindIc[n.kind][0])}</div>
      <div class="tx"><div class="t1" style="white-space:normal">${n.unread ? '<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--red);margin-right:6px;vertical-align:middle"></span>' : ''}${esc(n.title)}</div>

    const grouped = groups.map(g => `<div class="t-dayh"><b>${g.k}</b><span>${new Date(g.d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span></div>

});

      <div class="btn-row"><div class="field" style="flex:1"><label for="r-first">First name</label><input class="input" id="r-first" value="${fv('r-first', b?.first || '')}" placeholder="As on their ID"></div>

      <div class="field"><label for="r-rel">Relationship</label><select class="select" id="r-rel">${['Parent', 'Sibling', 'Spouse', 'Child', 'Cousin', 'Friend', 'Other'].map(r => `<option ${(F['r-rel'] || b?.rel) === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>`;

        <div class="field"><label for="r-acc">Account number</label><input class="input" id="r-acc" inputmode="numeric" value="${fv('r-acc', a0?.type === 'bank' ? a0.number : '')}" placeholder="e.g. 1000234567812"></div>`,
      partner: `<div class="field"><label for="r-bank">Pickup location</label><select class="select" id="r-bank">${CFG.partners.map(x => `<option>${x}</option>`).join('')}</select></div>

    }[BF.type];

function rerenderForm() {
  // keep typed values across payout-type switches
  const p = S.nav.cur.params; if (p.form) { delete p.form['r-acc']; delete p.form['r-bank']; }
  const keep = {}; ['r-first', 'r-last', 'r-phone', 'r-rel'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  render();
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
}
function submitRecipient() {
  const p = S.nav.cur.params, err = $('#r-err');
  const v = id => (document.getElementById(id)?.value || '').trim();
  p.form = {}; ['r-first', 'r-last', 'r-phone', 'r-rel', 'r-acc', 'r-bank'].forEach(id => { const el = document.getElementById(id); if (el) p.form[id] = el.value; });
  const fail = m => { err.hidden = false; err.textContent = m; err.scrollIntoView({ block: 'center' }); };
  let person = null;
  if (p.mode !== 'account') {
    if (!v('r-first') || !v('r-last')) return fail('Enter the recipient\u2019s first and last name as shown on their ID.');
    const ph = v('r-phone').replace(/\s/g, '');
    if (!/^[79]\d{8}$/.test(ph)) return fail('Enter a valid Ethiopian mobile number (9 digits, starting with 9 or 7).');
    person = { first: v('r-first'), last: v('r-last'), phone: '+251 ' + ph.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3'), rel: v('r-rel') };
  }
  let acc;
  if (BF.type === 'mpesa') {
    const n = v('r-acc').replace(/\s/g, '');
    if (!/^[79]\d{8}$/.test(n)) return fail('Enter a valid M-PESA number (9 digits after +251).');
    acc = { type: 'mpesa', provider: 'M-PESA Wallet', number: '+251 ' + n.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') };
  } else if (BF.type === 'bank') {
    const n = v('r-acc').replace(/\s/g, '');
    if (!/^\d{7,16}$/.test(n)) return fail('Account numbers are 7\u201316 digits.');
    acc = { type: 'bank', provider: v('r-bank'), number: n };
  } else acc = { type: 'partner', provider: v('r-bank'), number: 'Pickup code on success' };
  go('validate-recipient', { ...p, person, acc }, { replace: false });
}
/* payout-type picker for "How will they receive money?" — bottom sheet like the send flow */
function payoutTypeSheet() {
  const rows = Object.entries(CFG.payouts).map(([k, v]) => `<button class="opt-tile ${BF.type === k ? 'on' : ''}" onclick="BF.type='${k}';closeOverlay();rerenderForm()">
    <div class="ic">${ic(v.icon)}</div><div class="tx"><div class="t1">${v.label}</div><div class="t2">${v.desc}</div></div><div class="radio"></div></button>`);
  sheet(`<h3>How will they receive money?</h3>${rows.join('')}`);
}

/* Validate recipient: bottom card over the (dimmed) recipient form — same pattern as sending money */
screen('validate-recipient', 'BF-06', 'Recipients', 'Validate recipient', {
  render: p => `${REG['add-recipient'].render({ ...p, _init: true })}
    <div class="proc-ov">
      <div class="proc-sheet" role="status" aria-live="polite">
        <div class="grab"></div>
        <button class="kc-close" onclick="back()" aria-label="Close">${ic('close', 2.4)}</button>
        <div class="ps-art" id="vrArt">${mpesaAnim(110, 'ps-anim')}</div>
        <h2 id="vrTitle">Checking details\u2026</h2>
        <p id="vrSub">Confirming the account with ${esc(p.acc?.provider || 'the payout partner')}.</p>
        <div id="vrBody"></div>
        <div class="ps-actions" id="vrAct"></div>
      </div>
    </div>`,
  after: p => later(() => {
    const bad = p.acc && ((p.acc.type === 'bank' && p.acc.number.startsWith('0000')) || (p.acc.type === 'mpesa' && p.acc.number.endsWith('000 000')));
    const name = ((p.person ? p.person.first + ' ' + p.person.last : fullName(benById(p.id)))).toUpperCase();
    const art = $('#vrArt'); if (!art) return;
    const sub = $('#vrSub'); sub.classList.remove('in'); void sub.offsetWidth; sub.classList.add('in');
    if (bad) {
      art.innerHTML = `<div class="ok-sq red">${ic('close', 3)}</div>`;
      $('#vrTitle').textContent = 'We couldn\u2019t verify this account';
      sub.textContent = p.acc.type === 'bank' ? `${p.acc.provider} says this account number doesn\u2019t exist or is closed.` : 'This number isn\u2019t registered for M-PESA.';
      $('#vrAct').innerHTML = `<div class="ps-row"><button class="ps-btn light" onclick="go('support-request',{cat:'Recipient details'})">Get help</button><button class="ps-btn" onclick="back()">Edit details</button></div>`;
      return;
    }
    art.innerHTML = `<div class="ok-sq">${ic('check', 3)}</div>`;
    $('#vrTitle').textContent = 'Account verified';
    sub.textContent = 'Is this the right account holder?';
    $('#vrBody').innerHTML = `<div class="ps-name">${esc(name)}</div>`;
    $('#vrAct').innerHTML = `<div class="ps-row"><button class="ps-btn light" onclick="back()">No, edit</button><button class="ps-btn" onclick="saveRecipient('${name.replace(/'/g, '')}')">Yes, save</button></div>`;
  }, 1400)
});
function saveRecipient(verifiedName) {
  const p = S.nav.cur.params;
  const acc = { ...p.acc, verifiedName };
  let b;
  if (p.mode === 'account') { b = benById(p.id); b.accounts.push(acc); }
  else if (p.mode === 'edit') { b = benById(p.id); Object.assign(b, p.person); b.accounts[0] = acc; }
  else { b = { id: 'b' + Date.now(), ...p.person, fav: false, accounts: [acc] }; S.beneficiaries.unshift(b); }
  // return to the right place
  const inSend = S.nav.stack.some(s => s.id === 'send-recipient' || s.id === 'send-payout');
  if (inSend) {
    S.draft.ben = b.id; S.draft.accIdx = b.accounts.indexOf(acc);
    while (S.nav.stack.length && !['send-recipient', 'send-payout'].includes(S.nav.stack[S.nav.stack.length - 1].id)) S.nav.stack.pop();
    S.nav.stack.pop();
    go('send-payout', {}, { replace: true });
  } else {
    S.nav.stack = [{ id: 'home', params: {} }, { id: 'recipients', params: {} }];
    S.nav.cur = { id: 'recipient-detail', params: { id: b.id } }; render();
  }
  toast(p.mode === 'edit' ? 'Changes saved' : 'Recipient saved');
}

/* =====================================================================
   05/06 — SEND MONEY & PAYMENT
   ===================================================================== */
function startSend(benId) {
  if (!kycGate()) return;
  S.draft = newDraft();
  if (benId) { S.draft.ben = benId; }
  go('send-amount');
}
function exitSend() {
  dialog(`<div class="big-ic grey">${ic('close')}</div><h3>Cancel this transfer?</h3><p>You haven’t been charged.</p>
    <button class="btn btn-primary" onclick="closeOverlay();root('home')">Yes, cancel</button><button class="btn btn-ghost mt8" onclick="closeOverlay()">Keep going</button>`);
}
const draftAcc = () => { const b = benById(S.draft.ben); return b ? b.accounts[S.draft.accIdx] || b.accounts[0] : null; };
const draftPayType = () => draftAcc()?.type || S.draft.payType || 'mpesa';
const draftQuote = () => quote(S.draft.amount, draftPayType());

screen('send-amount', 'SM-03', 'Send Money', 'Amount, rate & fees', {
  render: () => {
    const d = S.draft, q = draftQuote(), pt = draftPayType();
    const country = CFG.countries.find(x => x.code === d.country) || CFG.countries[0];
    const sc = CFG.sendCurrencies.find(x => x.code === (d.sendCur || 'USD')) || CFG.sendCurrencies[0];
    const recvAmt = q.receive || 0;
    return `${topbar({ right: 'exit' })}<div class="page-title with-steps"><span class="pt-text">How much?</span>${stepper(0)}</div>
    <div class="scroll"><div class="pad">

/* Slide-to-pay: drag the thumb to the end (or press Enter / → on it) to confirm */
function slideEnable(on) {
  const sl = $('#rv-slide'); if (!sl) return;
  sl.classList.toggle('off', !on);
  $('#rv-go').disabled = !on;
  const l = sl.querySelector('.slide-label'); l.textContent = on ? l.dataset.on : l.dataset.off;
}
function initSlide() {
  const sl = $('#rv-slide'), th = $('#rv-go'), fill = sl.querySelector('.slide-fill'), label = sl.querySelector('.slide-label');
  const max = () => sl.clientWidth - th.offsetWidth - 8;
  let x = 0, start = 0, dragging = false, done = false;
  const set = (v, anim) => {
    x = Math.max(0, Math.min(max(), v));
    th.style.transition = fill.style.transition = anim ? 'transform .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1)' : 'none';
    th.style.transform = `translateX(${x}px)`;
    fill.style.width = (x + th.offsetWidth + 4) + 'px';
    label.style.opacity = String(Math.max(0, 1 - x / (max() * 0.6)));
    th.setAttribute('aria-valuenow', Math.round(x / max() * 100));
  };
  const finish = () => {
    done = true; set(max(), true); sl.classList.add('done');
    th.innerHTML = ic('check', 3); label.style.opacity = '1'; label.textContent = 'Authorizing\u2026';
    setTimeout(() => {
      confirmPay();
      // still here (e.g. rate expired sheet) → reset the slider
      setTimeout(() => { if (S.nav.cur.id === 'send-review' && $('#rv-slide')) { done = false; sl.classList.remove('done'); th.innerHTML = ic('chev', 2.8) + ic('chev', 2.8); label.textContent = label.dataset.on; set(0, true); } }, 60);
    }, 380);
  };
  th.addEventListener('pointerdown', e => { if (th.disabled || done) return; dragging = true; start = e.clientX - x; th.setPointerCapture(e.pointerId); sl.classList.add('drag'); });
  th.addEventListener('pointermove', e => { if (dragging) set(e.clientX - start, false); });
  const up = () => { if (!dragging) return; dragging = false; sl.classList.remove('drag'); x >= max() * 0.88 ? finish() : set(0, true); };
  th.addEventListener('pointerup', up); th.addEventListener('pointercancel', up);
  th.addEventListener('keydown', e => { if (!th.disabled && !done && ['Enter', ' ', 'ArrowRight'].includes(e.key)) { e.preventDefault(); finish(); } });
  set(0, false);
}
function confirmPay() {
  if (Date.now() > S.draft.expires) {
    const old = CFG.rate;
    CFG.rate = Math.round((CFG.rate + (Math.random() - 0.5) * 0.6) * 100) / 100;
    S.draft.expires = Date.now() + CFG.quoteSeconds * 1000;

function procOpen(ref) { S.nav.stack = [{ id: 'home', params: {} }]; S.nav.cur = { id: 'send-success', params: { ref } }; render(); }
function finishTransfer(navigate = true) {
  const d = S.draft, b = benById(d.ben), a = draftAcc(), q = draftQuote();
  const pm = S.paymentMethods.find(m => m.id === d.payment) || S.paymentMethods[0];
  const review = S.demo.outcome === 'compliance';
  const t = { ref: newRef(), ben: b.id, acc: { ...a }, amount: q.amount, fee: q.fee, total: q.total, rate: q.rate, receive: q.receive, bonus: q.bonus,
    payment: pm.label + (pm.last4 ? ' \u2022\u2022\u2022\u2022 ' + pm.last4 : ''), status: review ? 'compliance' : 'payout', date: new Date().toISOString() };
  if (a.type === 'partner') t.pickup = String(Math.floor(10000000 + Math.random() * 89999999));

  if (!review) setTimeout(() => {   // simulate payout completion
    t.status = 'completed'; t.done = new Date().toISOString();

   07/08/09 — RECEIPT, TRACKING, HISTORY
   ===================================================================== */
/* timeline step: rail node + card. cls: done | cur | todo | fail. time is shown top-right. */
function tlStep(cls, t1, t2, time) {
  const node = cls === 'done' ? ic('check', 3.4) : cls === 'fail' ? ic('close', 3.4) : '';
  return `<div class="tl ${cls}"><div class="dot">${node}</div>
    <div class="tl-card"><div class="t1"><span>${t1}</span>${time ? `<span class="tm">${time}</span>` : ''}</div><div class="t2">${t2}</div>
    ${cls === 'cur' ? '<span class="tl-busy" aria-label="In progress"><i></i></span>' : ''}</div></div>`;
}
function timeline(t) {
  const po = CFG.payouts[t.acc.type];
  const at = (mins) => fmtTime(new Date(new Date(t.date).getTime() + mins * 60000));
  const S_ = (cls, t1, t2) => { const m = String(t2).match(/^(.*?)\s*\u2022\s*(\d{1,2}:\d{2}\s?[AP]M)$/) || String(t2).match(/^()(\d{1,2}:\d{2}\s?[AP]M)$/);
    return m ? tlStep(cls, t1, m[1] || (cls === 'done' ? 'Handed over' : ''), m[2]) : tlStep(cls, t1, t2); };
  const failed = ['failed', 'refund_pending', 'refunded'].includes(t.status);
  const order = ['submitted', 'compliance', 'processing', 'payout', 'completed'];
  const idx = failed ? 3 : order.indexOf(t.status);
  const st = i => i < idx ? 'done' : i === idx ? (t.status === 'completed' ? 'done' : 'cur') : 'todo';
  let h = S_('done', 'Transfer submitted', `Payment received \u2022 ${at(0)}`);
  h += S_(idx > 1 ? 'done' : st(1), 'Compliance checks', idx > 1 ? `Passed \u2022 ${at(1)}` : 'Fraud, sanctions and AML/CFT screening');
  h += S_(idx > 2 ? 'done' : st(2), 'Sent to ' + (t.acc.type === 'mpesa' ? 'M-PESA' : t.acc.provider), idx > 2 ? at(2) : 'Waiting for compliance');
  if (failed) {
    h += S_('fail', 'Payout failed', esc(t.failReason || 'The payout partner could not complete the transfer.'));
    h += S_('done', 'Refund started', `${usd(t.total)} back to ${esc(t.payment)}`);
    h += S_(t.status === 'refunded' ? 'done' : 'cur', t.status === 'refunded' ? 'Refunded' : 'Refund in progress', t.status === 'refunded' ? 'Returned to your payment method' : 'Usually 3\u20135 business days to appear on your statement');
  } else {
    h += S_(t.status === 'completed' ? 'done' : idx === 3 ? 'cur' : 'todo', t.status === 'completed' ? 'Delivered' : 'Delivering to recipient', t.status === 'completed' ? `${etb(t.receive)} received${t.done ? ' \u2022 ' + fmtTime(t.done) : ''}` : po.eta);
  }
  return `<div class="timeline">${h}</div>`;
}

function toIsoDate(d) {
  const x = new Date(d);
  if (isNaN(x.getTime())) return '';
  const y = x.getFullYear();
  const m = String(x.getMonth() + 1).padStart(2, '0');
  const day = String(x.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const fmtIsoDate = s => {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

function setTxDatePreset(preset) {
  S.txDatePreset = preset;
  const now = new Date();
  if (preset === 'all') {
    S.txDateFrom = '';
    S.txDateTo = '';
  } else if (preset === 'today') {
    const today = toIsoDate(now);
    S.txDateFrom = today;
    S.txDateTo = today;
  } else if (preset === 'week') {
    const past = new Date(now.getTime() - 7 * 864e5);
    S.txDateFrom = toIsoDate(past);
    S.txDateTo = toIsoDate(now);
  } else if (preset === 'month') {
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    S.txDateFrom = toIsoDate(startOfMonth);
    S.txDateTo = toIsoDate(now);
  }
  render();
}

screen('history', 'TX-01', 'Transactions', 'History, search & filters', {

    const hasDateFilter = Boolean(S.txDateFrom || S.txDateTo || S.txDatePreset !== 'all');
    const hasActiveFilter = S.txFilter !== 'all' || hasDateFilter;

    const list = S.transactions.filter(F[S.txFilter]).filter(t => {
      if (S.txDateFrom || S.txDateTo) {
        const td = toIsoDate(t.date);
        if (S.txDateFrom && td < S.txDateFrom) return false;
        if (S.txDateTo && td > S.txDateTo) return false;
      }
      if (!q) return true;
      const b = benById(t.ben);
      return [t.ref, b ? fullName(b) : '', t.acc.provider, String(t.amount), STATUS[t.status].label].join(' ').toLowerCase().includes(q);
    });

    const f = (k, l) => `<button class="filter ${S.txFilter === k ? 'on' : ''}" onclick="S.txFilter='${k}';render()">${l}</button>`;

    let activeFilterDesc = [];

      activeFilterDesc.push(S.txFilter === 'active' ? 'In progress' : S.txFilter.charAt(0).toUpperCase() + S.txFilter.slice(1));

    return `${topbar({ left: '', title: '' })}<div class="page-title" style="padding-top:0">Activity</div>
    <div class="scroll"><div class="pad">
      <div class="search-row"><div class="search">${ic('search')}<input placeholder="Search name, reference or amount" value="${esc(S.txSearch)}" oninput="S.txSearch=this.value;rerenderKeepFocus(this)"></div>

        </div>` : ''}

      <div class="filters-panel" hidden>
        <div class="filter-group">
          <div class="filter-group-head">
            <span class="filter-lbl">Status</span>
            ${S.txFilter !== 'all' ? `<button class="filter-reset-btn" onclick="S.txFilter='all';render()">Reset</button>` : ''}

          <div class="filters-chips">

        <div class="filter-group" style="margin-top:4px">

            </div>
          </div>
        </div>
      </div>

      ${!S.transactions.length ? emptyState('clock', 'No transfers yet', 'When you send money, you can track it here.', 'Send money', 'startSend()')
        : !list.length ? emptyState('search', 'No transfers found', 'Try a different search or filter.', 'Clear filters', 'clearAllTxFilters()')

/* Appearance: System (follows the phone) / Light / Dark — remembered on this device */
const THEMES = { system: { label: 'System', icon: 'phone', desc: 'Match your phone’s setting' }, light: { label: 'Light', icon: 'sun', desc: 'Always light' }, dark: { label: 'Dark', icon: 'moon', desc: 'Always dark' } };
function themeGet() { try { const t = localStorage.getItem('remi-theme'); return THEMES[t] ? t : 'system'; } catch (_) { return 'system'; } }
function themeSet(t) {
  try { t === 'system' ? localStorage.removeItem('remi-theme') : localStorage.setItem('remi-theme', t); } catch (_) {}
  if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  closeOverlay(); render();
}
function themeSheet() {
  const cur = themeGet();
  sheet(`<h3>Appearance</h3><p class="sub">Choose how Remi looks on this device.</p>${Object.entries(THEMES).map(([k, v]) => `<button class="opt-tile ${k === cur ? 'on' : ''}" onclick="themeSet('${k}')">
    <div class="ic">${ic(v.icon)}</div><div class="tx"><div class="t1">${v.label}</div><div class="t2">${v.desc}</div></div><div class="radio"></div></button>`).join('')}`);
}

}
function termsCheck() {}
function termsAccept(fromSignup) {
  S.termsAccepted = true;

  if (fromSignup) {
    const st = $('#su-terms');
    if (st) { st.checked = true; signupValid(); }
  } else {
    toast('Terms accepted');
  }
}

screen('support-request', 'SP-05', 'Help & Support', 'Raise support request', {

function submitTicket() {

}

/* =====================================================================
   Sidebar + demo controls + boot
   ===================================================================== */
function syncDemo() { const k = $('#demo-kyc'); if (k) k.value = S.demo.kyc; }
function buildSidebar() {
  const groups = {};
  // splash (ON-01) is intentionally excluded from the sidebar list
  ORDER.forEach(id => { const s = REG[id]; if (id === 'state' || id === 'splash') return; (groups[s.group] = groups[s.group] || []).push(s); });
  groups['States'] = [
    { id: 'state', code: 'ST-01', label: 'Network error', params: { kind: 'network' } },
    { id: 'state', code: 'ST-02', label: 'Server error', params: { kind: 'server' } },
    { id: 'state', code: 'ST-03', label: 'Session expired', params: { kind: 'session' } },
    { id: 'state', code: 'ST-11', label: 'Service unavailable', params: { kind: 'unavailable' } }
  ];
  const sel = 'style="width:100%;margin-top:4px;background:#1c1c1c;color:#fff;border:1px solid #333;border-radius:8px;padding:6px 8px;font-size:12px"';
  // Category accordion — collapsed by default; click the head to expand/collapse
  const accGroup = (name, body) => `<div class="sidebar-acc">
    <button type="button" class="sidebar-acc-head" aria-expanded="false" onclick="toggleSidebarGroup(this)"><span>${name}</span><span class="acc-caret">▾</span></button>
    <div class="sidebar-acc-body">${body}</div></div>`;
  $('#sidebar').innerHTML = `<div class="sidebar-title">${ic('mobile').replace('<svg', '<svg width="18" height="18"')} Remi Prototype</div>
    <div class="sidebar-sub">M-PESA Remit \u2022 mapped to URS v1.0 screen IDs</div>
    <div class="demo-codes">PIN <b>534312</b> • OTP any but <b>000000</b><br>Card <b>4242 4242 4242 4242</b><br>Bank acct starting <b>0000</b> fails</div>
    ${accGroup('Demo controls', `<div style="padding:0 22px 4px;font-size:12px;color:rgba(255,255,255,.6)">
      <label>KYC status<select id="demo-kyc" ${sel} onchange="S.demo.kyc=this.value;render()"><option value="approved">Approved</option><option value="none">Not started</option><option value="pending">In review</option><option value="failed">Failed</option></select></label>
      <label style="display:block;margin-top:8px">Next transfer outcome<select ${sel} onchange="S.demo.outcome=this.value"><option value="success">Success</option><option value="compliance">Held for compliance review</option><option value="payment_failed">Payment declined</option></select></label>
    </div>`)}
    ${Object.entries(groups).map(([g, list]) => accGroup(g, list.map(s =>
      `<div class="sidebar-tab" data-id="${s.id}" onclick='sidebarGo(${JSON.stringify(s.id)}, ${JSON.stringify(s.params || {})})'><span class="sid">${s.code}</span>${s.label}</div>`).join(''))).join('')}`;
}
function toggleSidebarGroup(btn) {
  const acc = btn.closest('.sidebar-acc');
  acc.classList.toggle('open');
  btn.setAttribute('aria-expanded', acc.classList.contains('open'));
}
function sidebarGo(id, params) {
  closeOverlay();
  const needsDraft = id.startsWith('send-') || id === 'payment-failed';
  if (needsDraft && !S.draft.ben) { S.draft.ben = 'b1'; S.draft.accIdx = 0; }
  if (id === 'send-review') S.draft.consent = false;
  const refScreens = ['tx-detail', 'receipt', 'send-success'];
  if (refScreens.includes(id) && !params.ref) params = { ...params, ref: S.transactions[0].ref };
  if (id === 'recipient-detail' && !params.id) params = { id: S.beneficiaries[0]?.id };
  if (id === 'validate-recipient') params = { mode: 'new', person: { first: 'Meron', last: 'Alemu', phone: '+251 911 555 222', rel: 'Friend' }, acc: { type: 'bank', provider: 'Awash Bank', number: '013200456789' } };
  if (id === 'otp' && !params.mode) params = { mode: 'signup', to: '+1 202 555 0147' };
  const tabs = ['home', 'recipients', 'history', 'profile'];
  if (tabs.includes(id)) return tab(id);
  if (['splash', 'welcome'].includes(id)) return root(id, params);
  S.nav.stack = [{ id: 'home', params: {} }];
  S.nav.cur = { id, params };
  render();
  // state entries share one id — highlight by label instead
  if (id === 'state') document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.getAttribute('onclick').includes('"' + params.kind + '"')));
}

buildSidebar();
root('splash');
</script>
